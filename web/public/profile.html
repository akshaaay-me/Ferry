<!doctype html>
<meta charset="utf-8">
<title>job agent · profile</title>
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width:46rem; padding-bottom:6rem }
  .bullet { border-left:2px solid var(--line); padding-left:.6rem; display:grid; gap:.35rem }
  /* .remove is absolutely-positioned by default (top-right of an .item); a
     bullet's own remove sits inline under it instead. */
  .bullet .remove { position:static }
  .add, .bullet .remove { justify-self:start }
</style>

<header>
  <h1>profile</h1>
  <nav class="topnav">
    <a href="/">review</a>
    <a href="/profile.html" aria-current="page">profile</a>
    <a href="/settings.html">settings</a>
    <a href="#" id="logout">logout</a>
  </nav>
</header>
<main id="main"></main>
<div class="bar">
  <button id="save" class="primary">save profile</button>
  <button id="resume">generate resume</button>
  <span class="status" id="status"></span>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[<>&"']/g,
  (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));

let profile = null;
let skillGroups = []; // [{group, skills:[...]}] - editing view of profile.skills, converted back on save
let dirty = false;
let loaded = false;

/** Every id in the profile, whatever section it lives in. */
function allIds() {
  return [
    ...profile.experience.flatMap((e) => (e.bullets || []).map((b) => b.id)),
    ...profile.projects.map((p) => p.id),
    ...profile.education.map((e) => e.id),
    ...profile.stories.map((s) => s.id),
  ].filter(Boolean);
}

/**
 * Mint an id that collides with nothing anywhere in the profile.
 *
 * The old version numbered within one section using an array-INDEX prefix
 * (`b${roleIndex}-`), so removing a role renumbered the survivors and the next
 * "add bullet" could hand out an id another role already held. The save then
 * 400'd on the server's duplicate check and the whole editing session was lost.
 * Scanning every id and taking the global max removes that class of bug for all
 * four callers at once.
 */
function uid(prefix) {
  const ids = new Set(allIds());
  let n = ids.size + 1;
  while (ids.has(`${prefix}${n}`)) n++;
  return `${prefix}${n}`;
}

function tagsToStr(t) { return (t || []).join(', '); }
function strToTags(s) { return s.split(',').map((t) => t.trim()).filter(Boolean); }

function markDirty() {
  dirty = true;
  $('#status').textContent = '';
  $('#status').classList.remove('err');
}

// --- Preferences (profile.match) ---
// The knobs that decide what the search actually finds. keywords[] and
// exclude_titles[] stay out of the UI - long, weighted, and documented inline
// in config/profile.json. saveProfile() merges this patch, so they survive.
function renderPrefs() {
  const m = profile.match || (profile.match = {});
  return `
  <fieldset>
    <legend>job preferences</legend>
    <p class="hint">Comma-separated. These drive the keyword prefilter — the LLM only ever reads what clears it.</p>
    <label>target roles
      <textarea data-pref="include_titles">${esc(tagsToStr(m.include_titles))}</textarea></label>
    <label>preferred locations
      <input data-pref="locations" value="${esc(tagsToStr(m.locations))}"></label>
    <label>companies to never show
      <input data-pref="exclude_companies" value="${esc(tagsToStr(m.exclude_companies))}"></label>
    <label class="inline">
      <input type="checkbox" data-pref="remote_ok" ${m.remote_ok ? 'checked' : ''}> remote roles count as a location match</label>
    <div class="grid2">
      <label>off-location penalty (0–1, higher = more international roles)
        <input type="number" min="0" max="1" step="0.05" data-pref="off_location_penalty" value="${esc(m.off_location_penalty ?? 0.75)}"></label>
      <label>seniority penalty (0–1, higher = more senior stretches)
        <input type="number" min="0" max="1" step="0.05" data-pref="seniority_penalty" value="${esc(m.seniority_penalty ?? 0.6)}"></label>
    </div>
  </fieldset>`;
}

function wirePrefs(root) {
  root.querySelectorAll('[data-pref]').forEach((el) => {
    const key = el.dataset.pref;
    el.oninput = el.onchange = () => {
      if (el.type === 'checkbox') profile.match[key] = el.checked;
      else if (el.type === 'number') profile.match[key] = Number(el.value);
      else profile.match[key] = strToTags(el.value);
    };
  });
}

// --- Basics ---
function renderBasics() {
  const b = profile.basics;
  const links = b.links || (b.links = {});
  return `
  <fieldset>
    <legend>basics</legend>
    <div class="grid2">
      <label>name <input data-bind="basics.name" value="${esc(b.name)}"></label>
      <label>headline <input data-bind="basics.headline" value="${esc(b.headline)}"></label>
      <label>email <input data-bind="basics.email" value="${esc(b.email)}"></label>
      <label>phone <input data-bind="basics.phone" value="${esc(b.phone)}"></label>
      <label>location <input data-bind="basics.location" value="${esc(b.location)}"></label>
      <label>work preference <input data-bind="basics.work_preference" value="${esc(b.work_preference)}"></label>
      <label>github <input data-bind="basics.links.github" value="${esc(links.github)}"></label>
      <label>linkedin <input data-bind="basics.links.linkedin" value="${esc(links.linkedin)}"></label>
      <label>site <input data-bind="basics.links.site" value="${esc(links.site)}"></label>
    </div>
  </fieldset>`;
}

function wireBasics(root) {
  root.querySelectorAll('[data-bind]').forEach((el) => {
    el.oninput = () => {
      const path = el.dataset.bind.split('.');
      let obj = profile;
      for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
      obj[path.at(-1)] = el.value;
    };
  });
}

// --- Skills ---
function renderSkills() {
  const rows = skillGroups.map((g, i) => `
    <div class="item">
      <button type="button" class="remove" data-remove-skill="${i}">remove</button>
      <label>group <input data-skill-group="${i}" value="${esc(g.group)}"></label>
      <label>skills (comma-separated) <input data-skill-list="${i}" value="${esc(tagsToStr(g.skills))}"></label>
    </div>`).join('');
  return `<fieldset><legend>skills</legend>${rows}<button type="button" class="add" id="add-skill">add group</button></fieldset>`;
}

function wireSkills(root) {
  root.querySelectorAll('[data-skill-group]').forEach((el) => {
    el.oninput = () => { skillGroups[+el.dataset.skillGroup].group = el.value; };
  });
  root.querySelectorAll('[data-skill-list]').forEach((el) => {
    el.oninput = () => { skillGroups[+el.dataset.skillList].skills = strToTags(el.value); };
  });
  root.querySelectorAll('[data-remove-skill]').forEach((el) => {
    el.onclick = () => { skillGroups.splice(+el.dataset.removeSkill, 1); renderAll(); };
  });
  $('#add-skill', root).onclick = () => {
    skillGroups.push({ group: '', skills: [] });
    renderAll(`[data-skill-group="${skillGroups.length - 1}"]`);
  };
}

// --- Experience ---
function renderExperience() {
  const items = profile.experience.map((e, ei) => {
    const bullets = e.bullets.map((b, bi) => `
      <div class="bullet">
        <div class="id">${esc(b.id)}</div>
        <textarea data-exp="${ei}" data-bullet="${bi}" data-field="text">${esc(b.text)}</textarea>
        <input data-exp="${ei}" data-bullet="${bi}" data-field="tags" value="${esc(tagsToStr(b.tags))}" placeholder="tags, comma-separated">
        <button type="button" class="remove" data-remove-bullet="${ei}:${bi}">remove bullet</button>
      </div>`).join('');
    return `
    <div class="item">
      <button type="button" class="remove" data-remove-exp="${ei}">remove role</button>
      <div class="grid2">
        <label>company <input data-exp="${ei}" data-field="company" value="${esc(e.company)}"></label>
        <label>role <input data-exp="${ei}" data-field="role" value="${esc(e.role)}"></label>
        <label>start (YYYY-MM) <input data-exp="${ei}" data-field="start" value="${esc(e.start)}"></label>
        <label>end (YYYY-MM or Present) <input data-exp="${ei}" data-field="end" value="${esc(e.end)}"></label>
        <label>location <input data-exp="${ei}" data-field="location" value="${esc(e.location)}"></label>
      </div>
      ${bullets}
      <button type="button" class="add" data-add-bullet="${ei}">add bullet</button>
    </div>`;
  }).join('');
  return `<fieldset><legend>experience</legend>${items}<button type="button" class="add" id="add-exp">add role</button></fieldset>`;
}

function wireExperience(root) {
  root.querySelectorAll('[data-exp][data-field]:not([data-bullet])').forEach((el) => {
    el.oninput = () => { profile.experience[+el.dataset.exp][el.dataset.field] = el.value; };
  });
  root.querySelectorAll('[data-bullet]').forEach((el) => {
    el.oninput = () => {
      const b = profile.experience[+el.dataset.exp].bullets[+el.dataset.bullet];
      b[el.dataset.field] = el.dataset.field === 'tags' ? strToTags(el.value) : el.value;
    };
  });
  root.querySelectorAll('[data-remove-bullet]').forEach((el) => {
    el.onclick = () => {
      const [ei, bi] = el.dataset.removeBullet.split(':').map(Number);
      profile.experience[ei].bullets.splice(bi, 1);
      renderAll();
    };
  });
  root.querySelectorAll('[data-remove-exp]').forEach((el) => {
    el.onclick = () => { profile.experience.splice(+el.dataset.removeExp, 1); renderAll(); };
  });
  root.querySelectorAll('[data-add-bullet]').forEach((el) => {
    el.onclick = () => {
      const ei = +el.dataset.addBullet;
      const bullets = profile.experience[ei].bullets;
      bullets.push({ id: uid('b'), text: '', tags: [] });
      renderAll(`[data-exp="${ei}"][data-bullet="${bullets.length - 1}"][data-field="text"]`);
    };
  });
  $('#add-exp', root).onclick = () => {
    profile.experience.push({ company: '', role: '', start: '', end: 'Present', location: '', bullets: [] });
    renderAll(`[data-exp="${profile.experience.length - 1}"][data-field="company"]`);
  };
}

// --- Projects ---
function renderProjects() {
  const items = profile.projects.map((p, i) => `
    <div class="item">
      <button type="button" class="remove" data-remove-proj="${i}">remove</button>
      <div class="id">${esc(p.id)}</div>
      <label>name <input data-proj="${i}" data-field="name" value="${esc(p.name)}"></label>
      <label>description <textarea data-proj="${i}" data-field="text">${esc(p.text)}</textarea></label>
      <label>tags <input data-proj="${i}" data-field="tags" value="${esc(tagsToStr(p.tags))}"></label>
    </div>`).join('');
  return `<fieldset><legend>projects</legend>${items}<button type="button" class="add" id="add-proj">add project</button></fieldset>`;
}

function wireProjects(root) {
  root.querySelectorAll('[data-proj]').forEach((el) => {
    el.oninput = () => {
      const p = profile.projects[+el.dataset.proj];
      p[el.dataset.field] = el.dataset.field === 'tags' ? strToTags(el.value) : el.value;
    };
  });
  root.querySelectorAll('[data-remove-proj]').forEach((el) => {
    el.onclick = () => { profile.projects.splice(+el.dataset.removeProj, 1); renderAll(); };
  });
  $('#add-proj', root).onclick = () => {
    profile.projects.push({ id: uid('pr'), name: '', text: '', tags: [] });
    renderAll(`[data-proj="${profile.projects.length - 1}"][data-field="name"]`);
  };
}

// --- Education ---
function renderEducation() {
  const items = profile.education.map((ed, i) => `
    <div class="item">
      <button type="button" class="remove" data-remove-edu="${i}">remove</button>
      <div class="id">${esc(ed.id)}</div>
      <div class="grid2">
        <label>school <input data-edu="${i}" data-field="school" value="${esc(ed.school)}"></label>
        <label>degree <input data-edu="${i}" data-field="degree" value="${esc(ed.degree)}"></label>
        <label>year <input data-edu="${i}" data-field="year" value="${esc(ed.year)}"></label>
      </div>
    </div>`).join('');
  return `<fieldset><legend>education</legend>${items}<button type="button" class="add" id="add-edu">add education</button></fieldset>`;
}

function wireEducation(root) {
  root.querySelectorAll('[data-edu]').forEach((el) => {
    el.oninput = () => { profile.education[+el.dataset.edu][el.dataset.field] = el.value; };
  });
  root.querySelectorAll('[data-remove-edu]').forEach((el) => {
    el.onclick = () => { profile.education.splice(+el.dataset.removeEdu, 1); renderAll(); };
  });
  $('#add-edu', root).onclick = () => {
    profile.education.push({ id: uid('ed'), school: '', degree: '', year: '' });
    renderAll(`[data-edu="${profile.education.length - 1}"][data-field="school"]`);
  };
}

// --- Stories (STAR interview prep) ---
function renderStories() {
  const items = profile.stories.map((s, i) => `
    <div class="item">
      <button type="button" class="remove" data-remove-story="${i}">remove</button>
      <div class="id">${esc(s.id)}</div>
      <label>prompt <input data-story="${i}" data-field="prompt" value="${esc(s.prompt)}"></label>
      <label>situation <textarea data-story="${i}" data-field="situation">${esc(s.situation)}</textarea></label>
      <label>task <textarea data-story="${i}" data-field="task">${esc(s.task)}</textarea></label>
      <label>action <textarea data-story="${i}" data-field="action">${esc(s.action)}</textarea></label>
      <label>result <textarea data-story="${i}" data-field="result">${esc(s.result)}</textarea></label>
      <label>tags <input data-story="${i}" data-field="tags" value="${esc(tagsToStr(s.tags))}"></label>
    </div>`).join('');
  return `<fieldset><legend>interview stories (STAR)</legend>${items}<button type="button" class="add" id="add-story">add story</button></fieldset>`;
}

function wireStories(root) {
  root.querySelectorAll('[data-story]').forEach((el) => {
    el.oninput = () => {
      const s = profile.stories[+el.dataset.story];
      s[el.dataset.field] = el.dataset.field === 'tags' ? strToTags(el.value) : el.value;
    };
  });
  root.querySelectorAll('[data-remove-story]').forEach((el) => {
    el.onclick = () => { profile.stories.splice(+el.dataset.removeStory, 1); renderAll(); };
  });
  $('#add-story', root).onclick = () => {
    profile.stories.push({ id: uid('st'), prompt: '', situation: '', task: '', action: '', result: '', tags: [] });
    renderAll(`[data-story="${profile.stories.length - 1}"][data-field="prompt"]`);
  };
}

/**
 * Full re-render on every structural change. Cheap enough at this size, but it
 * used to dump you at the top of the page with nothing focused every time you
 * clicked "add bullet" - so keep the scroll position, and put the cursor in the
 * first field of whatever was just added.
 */
function renderAll(focusSel) {
  const main = $('#main');
  const y = window.scrollY;
  // Every call after the initial one is a structural edit (add/remove); the
  // delegated input listener only catches typing, not those.
  if (loaded) markDirty();
  main.innerHTML = renderPrefs() + renderBasics() + renderSkills() + renderExperience()
    + renderProjects() + renderEducation() + renderStories();
  wirePrefs(main); wireBasics(main); wireSkills(main); wireExperience(main);
  wireProjects(main); wireEducation(main); wireStories(main);
  window.scrollTo(0, y);
  if (focusSel) {
    const el = $(focusSel, main);
    if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }
}

async function load() {
  profile = await (await fetch('/api/profile')).json();
  skillGroups = Object.entries(profile.skills || {}).map(([group, skills]) => ({ group, skills }));
  renderAll();
  loaded = true;
  // One delegated listener beats threading markDirty() through ~20 handlers;
  // it survives every re-render because #main itself is never replaced.
  $('#main').addEventListener('input', markDirty);
  $('#main').addEventListener('change', markDirty);
}

// Losing an editing session to an accidental back/refresh is the other way this
// page ate work. Browsers show their own generic wording; returnValue just arms it.
addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

$('#save').onclick = async () => {
  const btn = $('#save');
  profile.skills = Object.fromEntries(skillGroups.filter((g) => g.group).map((g) => [g.group, g.skills]));
  btn.disabled = true; btn.textContent = 'saving…';
  try {
    const res = await fetch('/api/profile', {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(profile),
    });
    const data = await res.json();
    $('#status').textContent = res.ok ? 'saved.' : `error: ${data.error}`;
    $('#status').classList.toggle('err', !res.ok);
    if (res.ok) dirty = false;
  } catch (err) {
    $('#status').textContent = `error: ${err.message}`;
    $('#status').classList.add('err');
  }
  btn.disabled = false; btn.textContent = 'save profile';
};

$('#resume').onclick = async () => {
  const btn = $('#resume');
  btn.disabled = true; btn.textContent = 'generating…';
  const res = await (await fetch('/api/profile/resume', { method: 'POST' })).json();
  btn.disabled = false; btn.textContent = 'generate resume';
  $('#status').textContent = res.ok ? '' : `error: ${res.error}`;
  if (res.ok) window.open(res.pdf || res.html, '_blank');
};

$('#logout').onclick = async (e) => {
  e.preventDefault();
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login.html';
};

load();
</script>
