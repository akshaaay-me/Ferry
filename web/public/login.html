<!doctype html>
<meta charset="utf-8">
<title>job agent · login</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh }
  form { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:var(--s6); width:20rem; display:grid; gap:var(--s3) }
  h1 { margin:0 0 var(--s1); text-align:center }
  input, button { width:100%; padding:.55rem .6rem }
  .error { color:var(--err); font-size:var(--t-sm); text-align:center; min-height:1.2em }
</style>

<form id="f">
  <h1>job agent</h1>
  <input id="email" type="email" placeholder="email" autocomplete="username" required>
  <input id="password" type="password" placeholder="password" autocomplete="current-password" required>
  <div class="error" id="error"></div>
  <button type="submit" class="primary">log in</button>
</form>

<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error');
  errEl.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  if (res.ok) { location.href = '/'; return; }
  const data = await res.json().catch(() => ({}));
  errEl.textContent = data.error || 'login failed';
};
</script>
